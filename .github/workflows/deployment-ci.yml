name: Deployment automation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  deployment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployment success, failure, concurrency, and access checks
        run: node --test .github/scripts/deploy-coolify.test.mjs

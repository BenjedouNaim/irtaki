name: mobile-ci
on:
  # Always trigger on pull_request (no path filter here) so the required check
  # is always reported. The actual work is gated inside the job via the filter step.
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/web-ghcr-images]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - ".github/workflows/publish-image.yml"
    tags: ["mobile-v*"]
permissions:
  contents: read
jobs:
  mobile-ci:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.mobile }}
    defaults:
      run:
        working-directory: mobile
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for paths-filter git-diff mode (no API call)

      # Detect whether any mobile/** files changed. On push triggers this is
      # not needed (paths filter above already gates the job), but on PRs it
      # lets us skip the heavy steps fast and still report a green status.
      - name: Check for mobile changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          token: "" # use git diff instead of GitHub API (avoids permission errors)
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/mobile-ci.yml'
              - '.github/workflows/publish-image.yml'

      - name: Skip (no mobile changes)
        if: steps.changes.outputs.mobile == 'false'
        run: echo "No mobile files changed — skipping CI steps."

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.mobile == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.mobile == 'true'
        run: npm run lint

      - name: Type-check
        if: steps.changes.outputs.mobile == 'true'
        run: npm run type-check

      - name: Unit tests
        if: steps.changes.outputs.mobile == 'true'
        run: npm run test:unit

      # EAS Build and Submit placeholders — configure when Expo token exists
      # - name: Setup Expo
      #   uses: expo/expo-github-action@v8
      #   with:
      #     eas-version: latest
      #     token: ${{ secrets.EXPO_TOKEN }}
      # - name: EAS Build
      #   run: eas build --platform all --non-interactive

  web-image:
    needs: mobile-ci
    if: >-
      needs.mobile-ci.outputs.changed == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/chore/web-ghcr-images')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      context: mobile
      image: web
      api-base-url: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}

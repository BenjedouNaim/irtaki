name: mobile-ci
on:
  pull_request:
    paths: ['mobile/**']
  push:
    branches: [main]
    paths: ['mobile/**']
    tags: ['mobile-v*']
jobs:
  mobile-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit
      # EAS Build and Submit placeholders — configure when Expo token exists

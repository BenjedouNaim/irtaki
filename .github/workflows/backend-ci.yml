name: backend-ci
on:
  pull_request:
    paths: ['backend/**']
  push:
    branches: [main]
    paths: ['backend/**']
jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      # TypeORM connection is not exercised in unit tests; these values satisfy
      # module instantiation in CI without a real Postgres container.
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: irtaki
      DB_USER: irtaki
      DB_PASS: irtaki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit

// Applied by build-android-release.cjs. Kept outside android/ to survive prebuild.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.pluginManager.withPlugin('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                def required = ['ANDROID_UPLOAD_KEYSTORE', 'ANDROID_UPLOAD_KEY_ALIAS',
                    'ANDROID_UPLOAD_STORE_PASSWORD', 'ANDROID_UPLOAD_KEY_PASSWORD']
                if (required.any { !System.getenv(it) }) {
                    throw new GradleException('Missing upload signing settings. Run npm run release:android.')
                }
                def upload = android.signingConfigs.maybeCreate('irtakiUpload')
                upload.storeFile = project.file(System.getenv('ANDROID_UPLOAD_KEYSTORE'))
                upload.storePassword = System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')
                upload.keyAlias = System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
                upload.keyPassword = System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
                android.buildTypes.getByName('release').signingConfig = upload
            }
        }
    }
}

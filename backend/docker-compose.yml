# backend/docker-compose.yml
# Local development stack — Postgres + NestJS backend.
# NOT used in CI (unit tests run without a container) or production.
# Production runs on self-hosted Tunisian VPS managed by Coolify (ADR-014).
#
# Prerequisites:
#   cp .env.example .env   # then fill in your secrets
#
# Usage:
#   docker compose up --build -d   # build image, start postgres + backend
#   docker compose logs -f backend # tail backend logs
#   docker compose down -v         # stop and wipe volumes
#
# The backend service runs migrations automatically on startup (see CMD in Dockerfile).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: irtaki
      POSTGRES_USER: irtaki
      POSTGRES_PASSWORD: irtaki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irtaki -d irtaki"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DB_HOST so the backend reaches the compose postgres service
      # rather than localhost (which would be the container's own loopback).
      DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
